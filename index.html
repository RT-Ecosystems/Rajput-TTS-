<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rajput TTS Pro</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    background:#1e293b;
    padding:20px;
    border-radius:20px;
}

h1{
    text-align:center;
    color:#facc15;
}

textarea{
    width:100%;
    height:350px;
    padding:15px;
    border:none;
    border-radius:12px;
    resize:vertical;
    background:#334155;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

button{
    flex:1;
    min-width:120px;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.play{
    background:#22c55e;
    color:white;
}

.stop{
    background:#ef4444;
    color:white;
}

.download{
    background:#3b82f6;
    color:white;
}

audio{
    width:100%;
    margin-top:20px;
}

.status{
    margin-top:10px;
    color:#cbd5e1;
}

</style>
</head>
<body>

<div class="container">

<h1>Rajput TTS Pro</h1>

<textarea id="text" placeholder="यहाँ अपनी कहानी पेस्ट करें..."></textarea>

<div class="buttons">
    <button class="play" onclick="generateAudio()">▶ Generate Voice</button>
    <button class="stop" onclick="stopAudio()">⏹ Stop</button>
    <button class="download" onclick="downloadAudio()">⬇ Download MP3</button>
</div>

<div class="status" id="status">
Ready...
</div>

<audio id="player" controls></audio>

</div>

<script>

const textArea = document.getElementById("text");
const player = document.getElementById("player");
const statusText = document.getElementById("status");

let finalBlob = null;

function splitText(text, max=180){

    const sentences =
    text.match(/[^.!?।]+[.!?।]?/g) || [];

    let chunks = [];
    let current = "";

    for(let s of sentences){

        if((current + s).length > max){

            chunks.push(current.trim());
            current = s;

        }else{

            current += " " + s;
        }
    }

    if(current.trim()){
        chunks.push(current.trim());
    }

    return chunks;
}

async function getTTS(text){

    const url =
`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=hi&client=tw-ob`;

    const response = await fetch(url);

    if(!response.ok){
        throw new Error("TTS Error");
    }

    return await response.arrayBuffer();
}

async function generateAudio(){

    const text = textArea.value.trim();

    if(!text){
        alert("पहले टेक्स्ट लिखो");
        return;
    }

    try{

        statusText.innerText = "Generating audio...";

        const chunks = splitText(text);

        let buffers = [];

        for(let i=0;i<chunks.length;i++){

            statusText.innerText =
            `Generating part ${i+1}/${chunks.length}`;

            const data =
            await getTTS(chunks[i]);

            buffers.push(data);
        }

        finalBlob =
        new Blob(buffers,{type:'audio/mpeg'});

        const url =
        URL.createObjectURL(finalBlob);

        player.src = url;

        player.play();

        statusText.innerText =
        "Audio ready!";

    }catch(err){

        console.error(err);

        statusText.innerText =
        "ERROR: Google blocked request or CORS issue.";

        alert(
`अगर GitHub Pages पर error आए
तो Netlify/Vercel पर try करो.
कुछ browsers Google TTS को block करते हैं.`
);
    }
}

function stopAudio(){

    player.pause();
    player.currentTime = 0;
}

function downloadAudio(){

    if(!finalBlob){

        alert("पहले audio generate करो");
        return;
    }

    const a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(finalBlob);

    a.download =
    "rajput_tts.mp3";

    a.click();
}

</script>

</body>
</html>
