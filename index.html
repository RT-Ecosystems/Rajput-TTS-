<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajput TTS</title>

<style>
body{
margin:0;
padding:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:95%;
max-width:900px;
background:#1f2937;
padding:20px;
border-radius:18px;
}

h1{
text-align:center;
color:#facc15;
}

textarea{
width:100%;
height:320px;
padding:15px;
font-size:16px;
background:#374151;
color:white;
border:none;
border-radius:12px;
box-sizing:border-box;
resize:vertical;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.play{background:#22c55e;color:white;}
.stop{background:#ef4444;color:white;}
.download{background:#3b82f6;color:white;}

audio{
width:100%;
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
<h1>Rajput TTS</h1>

<textarea id="text" placeholder="यहाँ कहानी पेस्ट करें..."></textarea>

<div class="buttons">
<button class="play" onclick="generateSpeech()">▶ सुनें</button>
<button class="stop" onclick="stopSpeech()">⏹ रोकें</button>
<button class="download" onclick="downloadAudio()">⬇ डाउनलोड</button>
</div>

<audio id="audioPlayer" controls></audio>
</div>

<script>
const textarea = document.getElementById('text');
const audioPlayer = document.getElementById('audioPlayer');

let audioBlob = null;

function splitText(text, maxLength = 180) {
const sentences = text.match(/[^.!?।]+[.!?।]?/g) || [];
let chunks = [];
let current = '';

for (let sentence of sentences) {
if ((current + sentence).length > maxLength) {
chunks.push(current.trim());
current = sentence;
} else {
current += ' ' + sentence;
}
}

if (current.trim()) chunks.push(current.trim());

return chunks;
}

async function fetchAudioChunk(text) {
const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=hi&client=tw-ob`;

const response = await fetch(url);

if (!response.ok) {
throw new Error('TTS failed');
}

return await response.arrayBuffer();
}

async function generateSpeech() {
const text = textarea.value.trim();

if (!text) {
alert('पहले टेक्स्ट लिखें');
return;
}

try {
const chunks = splitText(text);
const audioBuffers = [];

for (let chunk of chunks) {
const data = await fetchAudioChunk(chunk);
audioBuffers.push(data);
}

const blob = new Blob(audioBuffers, { type: 'audio/mpeg' });
audioBlob = blob;

const url = URL.createObjectURL(blob);
audioPlayer.src = url;

audioPlayer.play();

} catch (e) {
alert('ऑडियो बनाने में समस्या आई');
}
}

function stopSpeech() {
audioPlayer.pause();
audioPlayer.currentTime = 0;
}

function downloadAudio() {
if (!audioBlob) {
alert('पहले ऑडियो बनाइए');
return;
}

const a = document.createElement('a');
a.href = URL.createObjectURL(audioBlob);
a.download = 'rajput_tts.mp3';
a.click();
}
</script>

</body>
</html>
